<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy LovAlma</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/almayfacu/imagenes-flipbook/refs/heads/main/alma.png">
  <style>
    :root {
      --pastel-pink: #ffd1dc;
      --pastel-blue: #c2f0fc;
      --pastel-lavender: #e6ccff;
      --pastel-yellow: #fff9c4;
      --text: #333;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      /* fuente común desktop/móvil */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffe4ec;
      overflow: hidden;
      min-height: 100dvh;
    }
    h1 { color: #ff4d94; animation: fadeIn 0.5s ease-in-out; }
    canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100dvh; /* pantalla completa */
      display: block; margin: 0;
      background: var(--pastel-blue);
      border: none; border-radius: 0; z-index: 1;
    }
    #info {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      color: var(--text); font-weight: bold; font-size: 18px;
      background-color: var(--pastel-yellow); padding: 8px 16px; border-radius: 20px;
      display: none; z-index: 5;
    }
    #overlay, #gameOver {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: none; justify-content: center; align-items: center;
      z-index: 10; flex-direction: column; text-align: center;
    }
    #overlay img { width: 300px; max-width: 90%; border-radius: 15px; box-shadow: 0 0 10px var(--pastel-pink); animation: fadeIn 0.5s ease-in-out; }
    .btn {
      margin-top: 20px; background: #ff4d94; border: none; padding: 10px 20px;
      font-size: 18px; border-radius: 10px; cursor: pointer; font-family: inherit; color: #ffffff; animation: fadeIn 0.5s ease-in-out;
    }
    #startScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--pastel-pink); display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 15; text-align: center; padding: 16px;
    }
    .confetti, .heart { position: absolute; animation: fall 2s linear forwards; z-index: 20; }
    .confetti { width: 8px; height: 8px; background: var(--pastel-yellow); }
    .heart {
      width: 12px; height: 12px; background: #ff4d94;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    @keyframes fall { to { transform: translateY(100vh); opacity: 0; } }
    @keyframes fadeIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>Flappy Love</h1>
    <button class="btn" onclick="startGame()">Comenzar</button>
  </div>
  <div id="info">Tiempo: <span id="time">0</span>s | Progreso: <span id="progress">0%</span></div>
  <canvas id="gameCanvas"></canvas>

  <div id="overlay">
    <h1>¡Ganaste, mi amor!</h1>
    <img id="finalImage" src="elegir.png" alt="Imagen final" />
    <button class="btn" onclick="resetGame()">Volver a jugar</button>
  </div>

  <div id="gameOver">
    <h1>¡Perdiste!</h1>
    <button class="btn" onclick="resetGame()">Volver a jugar</button>
  </div>

  <audio id="jumpSound" src="salto.mp3"></audio>
  <audio id="loseSound" src="go.mp3"></audio>
  <audio id="winSound" src="completado.mp3"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const jumpSound = document.getElementById("jumpSound");
    const loseSound = document.getElementById("loseSound");
    const winSound = document.getElementById("winSound");
    const overlay = document.getElementById("overlay");
    const gameOver = document.getElementById("gameOver");
    const info = document.getElementById("info");
    const startScreen = document.getElementById("startScreen");
    const timeEl = document.getElementById("time");
    const progressEl = document.getElementById("progress");

    // Imagen del pájaro
    const birdImage = new Image();
    birdImage.src = "avatar.png";

    let bird, gravity, lift, pipes, frame, score, maxScore, interval, gameInterval, timePassed, gamePaused;

    // ===== Parámetros (misma dificultad que te dejé antes) =====
    const PIPE_SPEED = 1.8;
    const PIPE_INTERVAL_FRAMES = 90;

    // ===== Vista estable por partida =====
    let gameW = 0, gameH = 0;   // ¡alto “congelado”!
    let GAP = 260;              // se fija al iniciar y no cambia
    let SAFE_MIN = 0, SAFE_MAX = 0;
    let MAX_DELTA = 0;
    let lastCenterY = null;

    function currentViewportHeight() {
      // altura CSS real, robusta en móvil
      return Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight);
    }

    // Redimensionado del canvas (render) con DPR limitado, sin tocar la lógica si el juego corre
    function resizeCanvas(keepGameMetrics = true) {
      const cssW = window.innerWidth;
      const cssH = currentViewportHeight();
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.floor(cssW * dpr);
      canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (!keepGameMetrics) {
        gameW = cssW;
        gameH = cssH;
        computeMetrics();
      }
    }
    window.addEventListener('resize', () => {
      // Si está en juego, solo reescala el canvas (no cambies reglas/colisiones)
      resizeCanvas(gamePaused ? false : true);
    });
    resizeCanvas(false);

    function computeMetrics() {
      // GAP uniforme para toda la partida
      GAP = Math.max(220, Math.min(340, Math.floor(gameH * 0.38)));
      SAFE_MIN = gameH * 0.35;
      SAFE_MAX = gameH * 0.65;
      MAX_DELTA = gameH * 0.18;
    }

    function resetGame() {
      cancelAnimationFrame(gameInterval);
      document.querySelectorAll('.confetti, .heart').forEach(e => e.remove());
      overlay.style.display = 'none';
      gameOver.style.display = 'none';
      startScreen.style.display = 'flex';
      info.style.display = 'none';
      gamePaused = true;
      // Al volver al menú, sincronizamos reglas a la vista actual
      resizeCanvas(false);
    }

    function initGame() {
      // Congela métricas de la partida con la vista actual
      resizeCanvas(false); // recalcula gameW/gameH y métricas
      bird = { x: 80, y: Math.min(150, gameH * 0.25), width: 50, height: 50, vy: 0 };
      gravity = 0.48;     // un poco menos de gravedad
      lift = -9;          // salto más fuerte
      pipes = [];
      frame = 0;
      score = 0;
      maxScore = 10;
      interval = PIPE_INTERVAL_FRAMES;
      timePassed = 0;
      gamePaused = false;

      lastCenterY = gameH * 0.5;
      seedPipes(); // tubos iniciales
    }

    function randomInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

    function pushPipeAt(xPos) {
      let targetCenter = SAFE_MIN + Math.random() * (SAFE_MAX - SAFE_MIN);

      // Suavizado respecto al tubo anterior
      const delta = targetCenter - lastCenterY;
      if (Math.abs(delta) > MAX_DELTA) {
        targetCenter = lastCenterY + Math.sign(delta) * MAX_DELTA;
      }

      // top/bottom dentro de pantalla con margen
      const top = Math.max(30, Math.min(targetCenter - GAP / 2, gameH - GAP - 30));
      const bottom = top + GAP;

      pipes.push({ x: xPos, width: 50, top, bottom });
      lastCenterY = targetCenter;
    }

    function seedPipes() {
      const firstX = Math.min(Math.max(340, gameW * 0.52), gameW * 0.7);
      const spacing = 240;
      for (let i = 0; i < 3; i++) pushPipeAt(firstX + i * spacing);
    }

    function drawBird() {
      if (birdImage.complete && birdImage.naturalWidth) {
        ctx.drawImage(birdImage, bird.x - bird.width / 2, bird.y - bird.height / 2, bird.width, bird.height);
      } else {
        ctx.fillStyle = "#ff7aa8";
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.width / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPipe(pipe) {
      ctx.fillStyle = "var(--pastel-yellow)";
      ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
      ctx.fillRect(pipe.x, pipe.bottom, pipe.width, gameH - pipe.bottom);
    }

    function update() {
      if (gamePaused) return;

      frame++;
      const fpsAssumed = 60;
      timePassed = Math.floor(frame / fpsAssumed);
      timeEl.textContent = timePassed;
      progressEl.textContent = Math.min(Math.floor((score / maxScore) * 100), 100) + "%";

      bird.vy += gravity;
      bird.y += bird.vy;

      // Nuevos tubos con hueco UNIFORME (usa GAP fijo)
      if (frame % interval === 0) {
        pushPipeAt(gameW);
      }

      // Mover/colisiones
      pipes.forEach(pipe => {
        pipe.x -= PIPE_SPEED;

        if (
          bird.x + bird.width / 2 > pipe.x &&
          bird.x - bird.width / 2 < pipe.x + pipe.width &&
          (bird.y - bird.height / 2 < pipe.top || bird.y + bird.height / 2 > pipe.bottom)
        ) {
          try { loseSound.currentTime = 0; loseSound.play(); } catch(e){}
          gamePaused = true;
          gameOver.style.display = 'flex';
        }

        if (pipe.x + pipe.width < bird.x && !pipe.passed) {
          score++;
          pipe.passed = true;
        }
      });

      // Bordes superior/inferior con altura estable
      if (bird.y + bird.height / 2 > gameH || bird.y < 0) {
        try { loseSound.currentTime = 0; loseSound.play(); } catch(e){}
        gamePaused = true;
        gameOver.style.display = 'flex';
      }

      // Victoria
      if (score >= maxScore) {
        gamePaused = true;
        overlay.style.display = 'flex';
        try { winSound.currentTime = 0; winSound.play(); } catch(e){}
        for (let i = 0; i < 50; i++) {
          const isHeart = Math.random() < 0.3;
          const particle = document.createElement('div');
          particle.classList.add(isHeart ? 'heart' : 'confetti');
          particle.style.left = Math.random() * 100 + 'vw';
          particle.style.background = isHeart ? '#ff4d94' : `hsl(${Math.random() * 360}, 100%, 80%)`;
          particle.style.animationDelay = Math.random() * 1 + 's';
          document.body.appendChild(particle);
        }
      }

      // limpiar tubos fuera de pantalla
      pipes = pipes.filter(p => p.x + p.width > 0);
    }

    function draw() {
      ctx.clearRect(0, 0, gameW, gameH);
      drawBird();
      pipes.forEach(drawPipe);
    }

    function loop() {
      update();
      draw();
      gameInterval = requestAnimationFrame(loop);
    }

    function startGame() {
      startScreen.style.display = 'none';
      info.style.display = 'block';
      initGame();
      loop();
    }

    birdImage.onload = () => {};
    birdImage.onerror = () => {};

    function playJumpSound() { try { jumpSound.currentTime = 0; jumpSound.play(); } catch(e){} }

    document.addEventListener("keydown", e => {
      if (e.code === "Space" && !gamePaused) {
        bird.vy = lift;
        playJumpSound();
      }
    }, { passive: true });

    document.addEventListener("touchstart", () => {
      if (!gamePaused) {
        bird.vy = lift;
        playJumpSound();
      }
    }, { passive: true });
  </script>
</body>
</html>
